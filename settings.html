<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>সেটিংস — হোমিও কেস স্টুডিও</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='45' font-size='38' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3E%E0%A6%B9%3C/text%3E%3C/svg%3E"/>
<link href="assets/css/base.css" rel="stylesheet"/>
<link href="assets/css/shell.css" rel="stylesheet"/>
<link href="assets/vendor/boxicons/boxicons.min.css" rel="stylesheet"/>
<style>
  .settings-form { max-width: 800px; margin: 0 auto; }
  .color-picker { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .color-option {
    width: 2.5rem; height: 2.5rem; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .color-option:hover { transform: scale(1.1); }
  .color-option.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
  .color-option i { color: #fff; font-size: 1.25rem; opacity: 0; transform: scale(0); transition: all 0.2s; }
  .color-option.active i { opacity: 1; transform: scale(1); }

  .theme-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-top: 0.5rem; }
  .theme-option {
    padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
    text-align: center; cursor: pointer; transition: all 0.2s;
    background: var(--surface); color: var(--text); font-weight: 600;
  }
  .theme-option:hover { border-color: var(--primary-light); }
  .theme-option.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
  .theme-option i { font-size: 1.5rem; display: block; margin-bottom: 0.25rem; }
</style>
</head>
<body data-page="settings" data-title="সেটিংস" data-crumb="হোম">

<div class="app-root">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-backdrop" id="appBackdrop"></div>
  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>
    <main class="app-content">
      <div class="content-inner settings-form">

        <div class="page-head">
          <div class="page-icon" style="background:var(--primary-bg); color:var(--primary);"><i class='bx bx-cog'></i></div>
          <div>
            <div class="eyebrow">কাস্টমাইজেশন</div>
            <h2>অ্যাপ সেটিংস</h2>
            <div class="subtitle">আপনার প্রোফাইল তথ্য এবং অ্যাপের থিম পছন্দ পরিবর্তন করুন।</div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="section-heading">
            <span class="section-number"><i class='bx bx-palette' style="font-size:1rem"></i></span>
            <div><h3>থিম ও রঙ (Theme & Colors)</h3><p>অ্যাপের চেহারা কাস্টমাইজ করুন</p></div>
          </div>
          
          <div style="margin-bottom: 1.5rem;">
            <label class="field"><span>ডার্ক মোড</span></label>
            <div class="theme-picker" id="themePicker">
              <div class="theme-option" data-val="system"><i class='bx bx-desktop'></i> সিস্টেম</div>
              <div class="theme-option" data-val="light"><i class='bx bx-sun'></i> লাইট</div>
              <div class="theme-option" data-val="dark"><i class='bx bx-moon'></i> ডার্ক</div>
            </div>
          </div>

          <div>
            <label class="field"><span>অ্যাপের প্রাথমিক রঙ (Accent Color)</span></label>
            <div class="color-picker" id="colorPicker">
              <!-- Colors added via JS -->
            </div>
          </div>
        </div>

        <form id="settingsForm">
          <div class="card" style="margin-bottom: 1.5rem;">
            <div class="section-heading">
              <span class="section-number"><i class='bx bx-clinic' style="font-size:1rem"></i></span>
              <div><h3>চিকিৎসকের তথ্য (Doctor Profile)</h3><p>এই তথ্যগুলো প্রেসক্রিপশনে স্বয়ংক্রিয়ভাবে ব্যবহৃত হবে</p></div>
            </div>
            <div class="grid two">
              <label class="field"><span>চিকিৎসকের নাম</span><input name="docName" placeholder="যেমন: ডাঃ মোঃ আব্দুর রহমান"/></label>
              <label class="field"><span>ডিগ্রি / পদবি</span><input name="docQual" placeholder="যেমন: DHMS, BHMS"/></label>
              <label class="field"><span>রেজি. নম্বর</span><input name="docReg"/></label>
              <label class="field"><span>মোবাইল</span><input name="docPhone"/></label>
              <label class="field full"><span>চেম্বারের নাম ও ঠিকানা</span><textarea name="docClinic" rows="3" placeholder="ক্লিনিকের নাম, ঠিকানা, ভিজিটের সময় ইত্যাদি"></textarea></label>
            </div>
            
            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
              <button class="btn primary" type="submit"><i class='bx bx-save'></i> সেটিংস সংরক্ষণ করুন</button>
            </div>
          </div>
        </form>

      </div>
    </main>
  </div>
</div>

<script src="assets/js/shell.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
